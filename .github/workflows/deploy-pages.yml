name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/hier-sind-wir-mf38tp"]
  workflow_dispatch:

# Rechte für das Deployment auf GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deployments vermeiden
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages automatisch (Quelle: GitHub Actions)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Gesamtes Repo-Wurzelverzeichnis (statische Web-App liegt im Root)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
